<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | matchestool</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<nav>
  <div class="inner container">
    <a href="/" class="brand">Matches<span>Tool</span></a>
  </div>
</nav>

<main class="auth-page">
  <div class="auth-shell">
    <section class="auth-brand-panel">
      <div class="auth-kicker">REAL-TIME SIGNAL ANALYSIS</div>
      <h2>Read the signal.<br><span>Choose your moment.</span></h2>
      <p>Access matchestool and keep your signal workspace in one clean, focused dashboard.</p>
      <div class="auth-orbit"></div>
    </section>
    <section class="auth-card">
    <h1>Welcome Back</h1>
    <p class="muted">Sign in to access your matchestool account.</p>

    <form id="loginForm">
      <label>Email Address</label>
      <input type="email" id="loginEmail" placeholder="Enter your email" required>

      <label>Password</label>
      <div class="password-wrap">
        <input type="password" id="loginPassword" placeholder="Enter your password" required>
        <button type="button" class="toggle-password" data-target="loginPassword">Show</button>
      </div>

      <button type="submit" class="btn primary auth-submit">Login</button>
    </form>

    <p class="auth-switch">
      Don't have an account?
      <a href="register.html">Create an account</a>
    </p>

    <p class="auth-switch">
      <a href="/">← Back to home</a>
    </p>
    </section>
  </div>
</main>

<script src="app.js"></script>
</body>
</html>
