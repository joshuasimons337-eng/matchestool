<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account | matchestool</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<nav>
  <div class="inner container">
    <a href="/" class="brand">Matches<span>Tool</span></a>
  </div>
</nav>

<main class="auth-page">
  <div class="auth-shell">
    <section class="auth-brand-panel">
      <div class="auth-kicker">matchestool ACCESS</div>
      <h2>Build your<br><span>signal workspace.</span></h2>
      <p>Create your account to access the matchestool signal experience.</p>
      <div class="auth-orbit"></div>
    </section>
    <section class="auth-card">
    <h1>Create Your Account</h1>
    <p class="muted">Create an account to get started with matchestool.</p>

    <form id="registerForm">
      <label>Email Address</label>
      <input type="email" id="registerEmail" placeholder="Enter your email" required>

      <label>Password</label>
      <div class="password-wrap">
        <input type="password" id="registerPassword" placeholder="Create a password" required>
        <button type="button" class="toggle-password" data-target="registerPassword">Show</button>
      </div>

      <label>Confirm Password</label>
      <div class="password-wrap">
        <input type="password" id="confirmPassword" placeholder="Confirm your password" required>
        <button type="button" class="toggle-password" data-target="confirmPassword">Show</button>
      </div>

      <button type="submit" class="btn primary auth-submit">
        Create Account
      </button>
    </form>

    <p class="auth-switch">
      Already have an account?
      <a href="login.html">Login</a>
    </p>

    <p class="auth-switch">
      <a href="/">← Back to home</a>
    </p>
    </section>
  </div>
</main>

<script src="app.js"></script>
</body>
</html>
